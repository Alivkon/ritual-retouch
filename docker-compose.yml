services:
  postgres:
    image: postgres:16-alpine
    container_name: postgre-ritual-retouch
    restart: unless-stopped
    environment:
      POSTGRES_DB: ritual_retouch
      POSTGRES_USER: ritual_retouch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ritual_retouch_internal

  bot:
    build: .
    image: ritual_retouch_bot
    container_name: ritual_retouch
    restart: unless-stopped
    depends_on:
      - postgres
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ritual_retouch:${POSTGRES_PASSWORD}@postgre-ritual-retouch:5432/ritual_retouch
    expose:
      - "8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - ritual_retouch_internal
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.ritualretouch.rule=Host(`ritual-retouch.ru`)"
      - "traefik.http.routers.ritualretouch.entrypoints=websecure"
      - "traefik.http.routers.ritualretouch.tls=true"
      - "traefik.http.routers.ritualretouch.tls.certresolver=mytlschallenge"
      - "traefik.http.services.ritualretouch.loadbalancer.server.port=8080"

volumes:
  uploads_data:
  postgres_data:

networks:
  ritual_retouch_internal:
  n8n_default:
    external: true
