<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritual Retouch Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17181c);
    --bg2: var(--tg-theme-secondary-bg-color, #24262d);
    --line: rgba(142, 142, 147, 0.28);
    --text: var(--tg-theme-text-color, #f6f7f9);
    --hint: var(--tg-theme-hint-color, #9da1aa);
    --btn: var(--tg-theme-button-color, #2f7df6);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --ok: #30d158;
    --bad: #ff453a;
    --warn: #ffd60a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    padding: 12px;
  }
  h1 { font-size: 18px; margin-bottom: 12px; font-weight: 650; }
  .stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat-card {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    min-height: 64px;
  }
  .stat-card .label { color: var(--hint); font-size: 11px; margin-bottom: 5px; }
  .stat-card .value { font-size: 22px; font-weight: 750; line-height: 1.1; }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .tab-btn {
    flex: 0 0 auto;
    min-width: 104px;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg2);
    color: var(--hint);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .tab-btn.active { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 680px; }
  th {
    text-align: left;
    color: var(--hint);
    padding: 8px 7px;
    border-bottom: 1px solid var(--line);
    font-weight: 600;
    position: sticky;
    top: 0;
    background: var(--bg2);
  }
  td { padding: 8px 7px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .muted { color: var(--hint); font-size: 11px; }
  .nowrap { white-space: nowrap; }
  .ellipsis { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .s-completed { color: var(--ok); }
  .s-failed { color: var(--bad); }
  .s-processing { color: var(--warn); }
  .s-pending { color: var(--hint); }
  .load-more, .action-btn, .admin-form button {
    border: none;
    background: var(--btn);
    color: var(--btn-text);
    cursor: pointer;
    font-weight: 650;
  }
  .load-more {
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    border-radius: 8px;
    font-size: 14px;
  }
  .load-more:disabled, .action-btn:disabled, .admin-form button:disabled { opacity: 0.55; cursor: default; }
  .action-btn { padding: 7px 9px; border-radius: 7px; font-size: 12px; white-space: nowrap; }
  .admin-form {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    display: grid;
    gap: 10px;
    max-width: 640px;
  }
  .admin-form label { display: grid; gap: 5px; color: var(--hint); font-size: 12px; }
  .admin-form input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
  }
  .admin-form button { width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; }
  .msg { padding: 16px; text-align: center; color: var(--hint); }
  .err { color: var(--bad); }
  .ok { color: var(--ok); }
  .admin-form textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    min-height: 140px;
    resize: vertical;
    font-family: monospace;
  }
  .stats-row { display: flex; gap: 8px; margin-top: 16px; }
  .stats-row .stat-card { flex: 1; }
  .campaign-stats-wrap { margin-top: 20px; }
  .campaign-stats-wrap h3 { font-size: 13px; color: var(--hint); margin-bottom: 10px; font-weight: 500; }
</style>
</head>
<body>
<h1>Панель администратора</h1>

<div id="stats" class="msg">Загрузка...</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('users')">Пользователи</button>
  <button class="tab-btn" onclick="switchTab('generations')">Генерации</button>
  <button class="tab-btn" onclick="switchTab('payments')">Платежи</button>
  <button class="tab-btn" onclick="switchTab('adjustments')">Начисления</button>
  <button class="tab-btn" onclick="switchTab('grant')">Добавить</button>
  <button class="tab-btn" onclick="switchTab('mailing')">Рассылка</button>
</div>

<div id="tab-users" class="tab-content active">
  <div class="table-wrap">
    <table>
      <thead><tr><th>Пользователь</th><th>Пакет</th><th>Осталось</th><th>Использовано</th><th>Последняя активность</th><th></th></tr></thead>
      <tbody id="usr-body"></tbody>
    </table>
  </div>
  <button class="load-more" id="usr-more" onclick="loadUsers()">Загрузить ещё</button>
</div>

<div id="tab-generations" class="tab-content">
  <div class="table-wrap">
    <table>
      <thead><tr><th>#</th><th>Пользователь</th><th>Промпт</th><th>Статус</th><th>Списано</th><th>Дата</th></tr></thead>
      <tbody id="gen-body"></tbody>
    </table>
  </div>
  <button class="load-more" id="gen-more" onclick="loadGen()">Загрузить ещё</button>
</div>

<div id="tab-payments" class="tab-content">
  <div class="table-wrap">
    <table>
      <thead><tr><th>#</th><th>Пользователь</th><th>Пакет</th><th>Сумма</th><th>Провайдер</th><th>Дата</th></tr></thead>
      <tbody id="pay-body"></tbody>
    </table>
  </div>
  <button class="load-more" id="pay-more" onclick="loadPay()">Загрузить ещё</button>
</div>

<div id="tab-adjustments" class="tab-content">
  <div class="table-wrap">
    <table>
      <thead><tr><th>#</th><th>Пользователь</th><th>Начислено</th><th>Было</th><th>Стало</th><th>Причина</th><th>Дата</th></tr></thead>
      <tbody id="adj-body"></tbody>
    </table>
  </div>
  <button class="load-more" id="adj-more" onclick="loadAdjustments()">Загрузить ещё</button>
</div>

<div id="tab-mailing" class="tab-content">
  <form class="admin-form" id="mailing-form">
    <label>
      Кампания (дата или название)
      <input id="mailing-campaign" autocomplete="off" placeholder="2026-06-14" required>
    </label>
    <label>
      Email-адреса (по одному на строку)
      <textarea id="mailing-emails" placeholder="agency1@mail.ru&#10;agency2@gmail.com&#10;..."></textarea>
    </label>
    <button id="mailing-submit" type="submit">Отправить рассылку</button>
    <div id="mailing-msg" class="msg"></div>
  </form>

  <div class="campaign-stats-wrap">
    <h3>Статистика кампании</h3>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="stats-campaign" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--text);font-size:14px"
             placeholder="2026-06-14" autocomplete="off">
      <button class="action-btn" style="padding:9px 14px;font-size:13px" onclick="loadCampaignStats()">Загрузить</button>
    </div>
    <div id="campaign-stats-result" class="stats-row" style="display:none">
      <div class="stat-card"><div class="label">Открытий</div><div class="value" id="cs-opened">—</div></div>
      <div class="stat-card"><div class="label">Кликов</div><div class="value" id="cs-clicked">—</div></div>
    </div>
  </div>
</div>

<div id="tab-grant" class="tab-content">
  <form class="admin-form" id="grant-form">
    <label>
      User ID
      <input id="grant-user-id" inputmode="numeric" autocomplete="off" required>
    </label>
    <label>
      Количество генераций
      <input id="grant-count" inputmode="numeric" autocomplete="off" required min="1" max="10000">
    </label>
    <label>
      Причина
      <input id="grant-reason" maxlength="300" autocomplete="off" placeholder="Например: компенсация за техническую ошибку">
    </label>
    <button id="grant-submit" type="submit">Добавить генерации</button>
    <div id="grant-msg" class="msg"></div>
  </form>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) tg.expand();
const initData = tg ? tg.initData : '';

let genPage = 0, payPage = 0, usrPage = 0, adjPage = 0;
let genDone = false, payDone = false, usrDone = false, adjDone = false;
let loaded = { users: false, generations: false, payments: false, adjustments: false };

async function api(path) {
  const r = await fetch(path, { headers: { 'Authorization': 'tma ' + initData } });
  if (r.status === 403) throw new Error('Нет доступа. Откройте панель из Telegram-бота администратором.');
  if (!r.ok) throw new Error('Ошибка сервера ' + r.status);
  return r.json();
}

async function apiPost(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: {
      'Authorization': 'tma ' + initData,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 403) throw new Error('Нет доступа. Откройте панель из Telegram-бота администратором.');
  if (!r.ok) throw new Error(data.error || 'Ошибка сервера ' + r.status);
  return data;
}

function esc(s) {
  if (s === undefined || s === null || s === '') return '—';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function num(v) {
  const n = Number(v || 0);
  return Number.isFinite(n) ? n.toLocaleString('ru-RU') : '0';
}

function dt(s) {
  if (!s) return '—';
  const d = new Date(s);
  return d.toLocaleDateString('ru-RU', {day:'2-digit',month:'2-digit',year:'2-digit'})
       + '\n' + d.toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
}

function userName(r) {
  if (r.email) return r.email;
  if (r.username) return '@' + r.username;
  return r.first_name || String(r.user_id);
}

function resetList(kind) {
  if (kind === 'users') { usrPage = 0; usrDone = false; document.getElementById('usr-body').innerHTML = ''; }
  if (kind === 'adjustments') { adjPage = 0; adjDone = false; document.getElementById('adj-body').innerHTML = ''; }
}

async function loadStats() {
  try {
    const s = await api('/api/admin/stats');
    document.getElementById('stats').innerHTML = `
      <div class="stats">
        <div class="stat-card"><div class="label">Пользователей</div><div class="value">${num(s.total_users)}</div></div>
        <div class="stat-card"><div class="label">Новых за 7 дней</div><div class="value">${num(s.new_users_7d)}</div></div>
        <div class="stat-card"><div class="label">Генераций</div><div class="value">${num(s.total_generations)}</div></div>
        <div class="stat-card"><div class="label">В обработке</div><div class="value">${num(s.processing_generations)}</div></div>
        <div class="stat-card"><div class="label">Успешных</div><div class="value">${num(s.completed_generations)}</div></div>
        <div class="stat-card"><div class="label">Ошибок</div><div class="value">${num(s.failed_generations)}</div></div>
        <div class="stat-card"><div class="label">Доступно генераций</div><div class="value">${num(s.available_generations)}</div></div>
        <div class="stat-card"><div class="label">Выручка</div><div class="value">${Number(s.total_revenue || 0).toFixed(0)}₽</div></div>
      </div>`;
  } catch(e) {
    document.getElementById('stats').innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
  }
}

async function loadUsers() {
  if (usrDone) return;
  const btn = document.getElementById('usr-more');
  btn.disabled = true; btn.textContent = 'Загрузка...';
  try {
    const rows = await api('/api/admin/users?page=' + usrPage);
    const tbody = document.getElementById('usr-body');
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.dataset.userId = r.user_id;
      tr.innerHTML = `
        <td class="nowrap">${esc(userName(r))}<br><span class="muted">${esc(r.user_id)}</span></td>
        <td>${esc(r.package_title || 'Нет пакета')}</td>
        <td><b class="remaining">${num(r.package_generations_remaining)}</b><br><span class="muted">из <span class="total">${num(r.package_generations_total)}</span></span></td>
        <td>${num(r.total_generations)}</td>
        <td style="white-space:pre;font-size:11px">${dt(r.last_generation_at || r.created_at)}</td>
        <td><button class="action-btn" onclick="prefillGrant('${esc(r.user_id)}')">Добавить</button></td>`;
      tbody.appendChild(tr);
    });
    if (rows.length < 200) { usrDone = true; btn.textContent = 'Всё загружено'; }
    else { usrPage++; btn.disabled = false; btn.textContent = 'Загрузить ещё'; }
  } catch(e) {
    document.getElementById('usr-body').innerHTML = `<tr><td colspan="6" class="msg err">${esc(e.message)}</td></tr>`;
    btn.textContent = 'Ошибка';
  }
}

async function loadGen() {
  if (genDone) return;
  const btn = document.getElementById('gen-more');
  btn.disabled = true; btn.textContent = 'Загрузка...';
  try {
    const rows = await api('/api/admin/generations?page=' + genPage);
    const tbody = document.getElementById('gen-body');
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${esc(r.id)}</td>
        <td class="nowrap">${esc(userName(r))}<br><span class="muted">${esc(r.user_id)}</span></td>
        <td class="ellipsis" title="${esc(r.prompt)}">${esc(r.prompt)}</td>
        <td class="s-${esc(r.status)}">${esc(r.status)}</td>
        <td>${num(r.generation_cost || 1)}</td>
        <td style="white-space:pre;font-size:11px">${dt(r.created_at)}</td>`;
      tbody.appendChild(tr);
    });
    if (rows.length < 50) { genDone = true; btn.textContent = 'Всё загружено'; }
    else { genPage++; btn.disabled = false; btn.textContent = 'Загрузить ещё'; }
  } catch(e) {
    document.getElementById('gen-body').innerHTML = `<tr><td colspan="6" class="msg err">${esc(e.message)}</td></tr>`;
    btn.textContent = 'Ошибка';
  }
}

async function loadPay() {
  if (payDone) return;
  const btn = document.getElementById('pay-more');
  btn.disabled = true; btn.textContent = 'Загрузка...';
  try {
    const rows = await api('/api/admin/payments?page=' + payPage);
    const tbody = document.getElementById('pay-body');
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${esc(r.id)}</td>
        <td class="nowrap">${esc(userName(r))}<br><span class="muted">${esc(r.user_id)}</span></td>
        <td>${esc(r.package_title || 'Пакет')}</td>
        <td><b>${Number(r.amount || 0).toFixed(0)}₽</b></td>
        <td>${esc(r.provider)}<br><span class="muted">${esc(r.status)}</span></td>
        <td style="white-space:pre;font-size:11px">${dt(r.paid_at || r.created_at)}</td>`;
      tbody.appendChild(tr);
    });
    if (rows.length < 50) { payDone = true; btn.textContent = 'Всё загружено'; }
    else { payPage++; btn.disabled = false; btn.textContent = 'Загрузить ещё'; }
  } catch(e) {
    document.getElementById('pay-body').innerHTML = `<tr><td colspan="6" class="msg err">${esc(e.message)}</td></tr>`;
    btn.textContent = 'Ошибка';
  }
}

async function loadAdjustments() {
  if (adjDone) return;
  const btn = document.getElementById('adj-more');
  btn.disabled = true; btn.textContent = 'Загрузка...';
  try {
    const rows = await api('/api/admin/generation-adjustments?page=' + adjPage);
    const tbody = document.getElementById('adj-body');
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${esc(r.id)}</td>
        <td class="nowrap">${esc(userName(r))}<br><span class="muted">${esc(r.user_id)}</span></td>
        <td><b>${num(r.delta)}</b></td>
        <td>${num(r.before_remaining)}</td>
        <td>${num(r.after_remaining)}</td>
        <td class="ellipsis" title="${esc(r.reason)}">${esc(r.reason)}</td>
        <td style="white-space:pre;font-size:11px">${dt(r.created_at)}</td>`;
      tbody.appendChild(tr);
    });
    if (rows.length < 50) { adjDone = true; btn.textContent = 'Всё загружено'; }
    else { adjPage++; btn.disabled = false; btn.textContent = 'Загрузить ещё'; }
  } catch(e) {
    document.getElementById('adj-body').innerHTML = `<tr><td colspan="7" class="msg err">${esc(e.message)}</td></tr>`;
    btn.textContent = 'Ошибка';
  }
}

function prefillGrant(userId) {
  switchTab('grant');
  document.getElementById('grant-user-id').value = String(userId);
  document.getElementById('grant-count').focus();
}

async function submitGrant(e) {
  e.preventDefault();
  const btn = document.getElementById('grant-submit');
  const msg = document.getElementById('grant-msg');
  const userId = document.getElementById('grant-user-id').value.trim();
  const count = Number(document.getElementById('grant-count').value.trim());
  const reason = document.getElementById('grant-reason').value.trim();

  msg.className = 'msg';
  msg.textContent = '';
  if (!userId || !Number.isInteger(count) || count <= 0 || count > 10000) {
    msg.className = 'msg err';
    msg.textContent = 'Укажите user_id и целое количество генераций от 1 до 10000.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Добавляем...';
  try {
    const r = await apiPost('/api/admin/users/' + encodeURIComponent(userId) + '/generations/add', { count, reason });
    msg.className = 'msg ok';
    msg.textContent = `Готово. Было ${num(r.before_remaining)}, стало ${num(r.after_remaining)}.`;

    const row = Array.from(document.querySelectorAll('tr[data-user-id]')).find((el) => el.dataset.userId === userId);
    if (row) {
      const remaining = row.querySelector('.remaining');
      const total = row.querySelector('.total');
      if (remaining) remaining.textContent = num(r.after_remaining);
      if (total) total.textContent = num(r.generations_total);
    }

    resetList('adjustments');
    loadAdjustments();
    loadStats();
  } catch(err) {
    msg.className = 'msg err';
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Добавить генерации';
  }
}

function switchTab(name) {
  const names = ['users', 'generations', 'payments', 'adjustments', 'grant', 'mailing'];
  document.querySelectorAll('.tab-content').forEach(el =>
    el.classList.toggle('active', el.id === 'tab-' + name));
  document.querySelectorAll('.tab-btn').forEach((b, i) =>
    b.classList.toggle('active', names[i] === name));

  if (name === 'users' && !loaded.users) { loaded.users = true; loadUsers(); }
  if (name === 'generations' && !loaded.generations) { loaded.generations = true; loadGen(); }
  if (name === 'payments' && !loaded.payments) { loaded.payments = true; loadPay(); }
  if (name === 'adjustments' && !loaded.adjustments) { loaded.adjustments = true; loadAdjustments(); }
}

async function sendMailing(e) {
  e.preventDefault();
  const btn = document.getElementById('mailing-submit');
  const msg = document.getElementById('mailing-msg');
  const campaign = document.getElementById('mailing-campaign').value.trim();
  const emailsRaw = document.getElementById('mailing-emails').value.trim();
  const emails = emailsRaw.split('\n').map(s => s.trim()).filter(Boolean);

  msg.className = 'msg'; msg.textContent = '';
  if (!campaign || emails.length === 0) {
    msg.className = 'msg err';
    msg.textContent = 'Укажите кампанию и список адресов.';
    return;
  }

  btn.disabled = true;
  btn.textContent = `Отправляем ${emails.length} писем...`;
  try {
    const r = await apiPost('/api/admin/send-campaign', { campaign, emails });
    msg.className = 'msg ok';
    msg.textContent = `Отправлено: ${r.sent}, ошибок: ${r.failed}`;
    document.getElementById('stats-campaign').value = campaign;
  } catch(err) {
    msg.className = 'msg err';
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Отправить рассылку';
  }
}

async function loadCampaignStats() {
  const campaign = document.getElementById('stats-campaign').value.trim();
  if (!campaign) return;
  try {
    const s = await api('/api/admin/campaign-stats?campaign=' + encodeURIComponent(campaign));
    document.getElementById('cs-opened').textContent = s.opened;
    document.getElementById('cs-clicked').textContent = s.clicked;
    document.getElementById('campaign-stats-result').style.display = 'flex';
  } catch(err) {
    alert(err.message);
  }
}

// Set default campaign date
document.getElementById('mailing-campaign').value = new Date().toISOString().slice(0, 10);

loadStats();
loaded.users = true;
loadUsers();
document.getElementById('grant-form').addEventListener('submit', submitGrant);
document.getElementById('mailing-form').addEventListener('submit', sendMailing);
</script>
</body>
</html>
