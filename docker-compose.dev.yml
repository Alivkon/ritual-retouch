services:
  postgres:
    image: postgres:16-alpine
    container_name: postgre-ritual-retouch
    restart: unless-stopped
    environment:
      POSTGRES_USER: ritual_retouch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ritual_retouch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Проброшено наружу для локальной разработки (на проде порт закрыт).
    # Хост 5433, т.к. 5432 занят системным PostgreSQL.
    ports:
      - "5433:5432"
    networks:
      - ritual_retouch_dev

  bot:
    build: .
    image: ritual_retouch_bot
    container_name: ritual_retouch
    restart: unless-stopped
    env_file: .env
    environment:
      # Совпадает с prod (docker-compose.yml), меняется только сеть/порты
      DATABASE_URL: postgresql://ritual_retouch:${POSTGRES_PASSWORD}@postgre-ritual-retouch:5432/ritual_retouch
      WEBAPP_URL: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - ritual_retouch_dev
    depends_on:
      - postgres

volumes:
  postgres_data:
  uploads_data:

networks:
  ritual_retouch_dev:
    name: ritual_retouch_dev
